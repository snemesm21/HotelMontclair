<!DOCTYPE html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Montclair Grand Hotel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/global.css?v=2" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        twine: "#BF925A",
                        "twine-hover": "#73503C",
                        mirage: "#141E26",
                        pampas: "#F2EEEB",
                        woodsmoke: "#111413",
                        silver: "#CAC6C6",
                    },
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                        display: ['"Cormorant Garamond"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        .gallery-item {
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="bg-pampas text-woodsmoke font-sans antialiased">
    <div th:replace="~{fragmentos :: navbar}"></div>

    <section class="bg-mirage text-white text-center px-6 pt-20 pb-16">
      <div class="max-w-[900px] mx-auto">
        <span class="block mb-4 font-sans text-[9px] tracking-[4px] uppercase font-bold text-twine">
          MONTCLAIR GRAND HOTEL
        </span>

        <h1 class="font-serif font-normal text-white text-4xl sm:text-5xl md:text-[54px] tracking-[2px] leading-tight mb-5 uppercase">
          Galería
        </h1>

        <p class="font-sans text-xs md:text-[13px] text-[#C2C9D1] font-light leading-relaxed max-w-[670px] mx-auto mb-8">
          Una mirada a la elegancia, el confort y la exclusividad que te esperan en Montclair Grand Hotel.
        </p>

        <div class="flex items-center justify-center gap-3">
          <div class="h-px w-14 bg-twine/40"></div>
          <div class="w-2 h-2 rotate-45 border border-twine"></div>
          <div class="h-px w-14 bg-twine/40"></div>
        </div>
      </div>
    </section>

    <!-- Gallery Grid -->
    <main class="bg-[#F5F1EB] py-16 px-6 flex-grow">
        <div class="max-w-[1152px] mx-auto">

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="/Images/Hotel Atardecer.jpg" alt="Fachada del Hotel" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-mirage/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-lg">Exteriores</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=800&q=80" alt="Habitación Suite" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Suites</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=800&q=80" alt="Restaurante Gourmet" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Gastronomía</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80" alt="Spa y Bienestar" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Spa</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&w=800&q=80" alt="Piscina Infinita" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Piscina</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1591088398332-8a7791972843?auto=format&fit=crop&w=800&q=80" alt="Interior Habitación" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Habitaciones</span>
                </div>
            </div>

            <div class="gallery-item md:col-span-2 h-96 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1200&q=80" alt="Salón de Eventos" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-mirage/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-lg">Eventos & Bodas</span>
                </div>
            </div>

            <div class="gallery-item h-96 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=800&q=80" alt="Servicio a la Habitación" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Room Service</span>
                </div>
            </div>
            
            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=800&q=80" alt="Baño de lujo" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Detalles</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=800&q=80" alt="Gimnasio" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-twine/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-sm">Fitness Center</span>
                </div>
            </div>

            <div class="gallery-item h-80 relative group cursor-pointer rounded-lg overflow-hidden shadow-md">
                <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=800&q=80" alt="Lounge Area" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-mirage/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                    <span class="text-white font-serif uppercase tracking-[2px] text-lg">Lounge & Lobby</span>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragmentos :: footer}"></div>
</body>
</html>
