<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario Tipo de Habitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6">
    <h1
      class="text-2xl font-bold mb-4"
      th:text="${roomType.id} == null ? 'Crear tipo de habitación' : 'Editar tipo de habitación'"
    >
      Formulario
    </h1>
    <form
      th:action="${roomType.id} == null ? @{/room-types/add} : @{'/room-types/edit/' + ${roomType.id}}"
      th:object="${roomType}"
      method="post"
      class="space-y-4 max-w-md"
    >
      <div>
        <label class="block font-medium">Nombre</label>
        <input
          type="text"
          th:field="*{name}"
          class="border rounded w-full p-2"
        />
      </div>
      <div>
        <label class="block font-medium">Descripción</label>
        <input
          type="text"
          th:field="*{description}"
          class="border rounded w-full p-2"
        />
      </div>
      <div>
        <label class="block font-medium">Precio por noche</label>
        <input
          type="number"
          step="0.01"
          th:field="*{pricePerNight}"
          class="border rounded w-full p-2"
        />
      </div>
      <div class="flex space-x-2">
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded"
        >
          Guardar
        </button>
        <a
          th:href="@{/room-types}"
          class="bg-gray-300 hover:bg-gray-400 text-black py-2 px-4 rounded"
          >Cancelar</a
        >
      </div>
    </form>
  </body>
</html>
