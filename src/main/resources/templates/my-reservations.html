<!doctype html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Reservas - Montclair Grand Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              twine: {
                DEFAULT: "#C59B63",
                hover: "#A87C49",
                dark: "#73503C",
                light: "#D4B07A",
              },
              mirage: { DEFAULT: "#141E26", dark: "#0F161C", light: "#1C2A35" },
              pampas: "#FAF7F2",
              pampasAlt: "#F0EBE3",
              woodsmoke: "#111413",
              silver: "#CAC6C6",
              ivory: "#FDFBF7",
            },
            fontFamily: {
              serif: ['"Cinzel"', "serif"],
              sans: ['"Inter"', "sans-serif"],
              display: ['"Cormorant Garamond"', "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-pampas text-woodsmoke font-sans antialiased selection:bg-twine selection:text-white min-h-screen flex flex-col justify-between"
  >
    <div th:replace="~{fragmentos :: navbar}"></div>

    <main class="flex-grow max-w-4xl w-full mx-auto p-6 sm:p-8 lg:p-12">
      <div
        class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8"
      >
        <div>
          <span
            class="font-sans text-[9px] tracking-[4px] text-twine uppercase font-bold block mb-1"
            >PORTAL DEL HUÉSPED</span
          >
          <h1
            class="font-serif text-2xl sm:text-3xl text-woodsmoke tracking-[2px] uppercase"
          >
            Mis Reservas
          </h1>
        </div>
        <a
          th:href="@{/reservations/new}"
          class="inline-flex items-center gap-2 bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3 px-5 rounded-[2px] transition duration-300 shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Nueva Reserva
        </a>
      </div>

      <div
        th:if="${#lists.isEmpty(reservations)}"
        class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-sm p-12 text-center"
      >
        <p class="text-sm text-woodsmoke/50 italic">
          Todavía no tienes reservas.
        </p>
      </div>

      <div
        th:each="res : ${reservations}"
        class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-lg p-6 mb-6 relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 right-0 h-1 bg-twine"></div>

        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4"
        >
          <h3 class="font-serif text-lg text-woodsmoke tracking-wide">
            Estancia del
            <span
              th:text="${#temporals.format(res.checkInDate, 'dd/MM/yyyy')}"
            ></span>
            al
            <span
              th:text="${#temporals.format(res.checkOutDate, 'dd/MM/yyyy')}"
            ></span>
          </h3>
          <span
            th:if="${res.status == 'CONFIRMED'}"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[2px] text-[9px] uppercase tracking-wider font-bold bg-blue-50 text-blue-800 border border-blue-200 self-start sm:self-auto"
          >
            Confirmada
          </span>
          <span
            th:if="${res.status != 'CONFIRMED'}"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[2px] text-[9px] uppercase tracking-wider font-bold bg-gray-50 text-gray-800 border border-gray-200 self-start sm:self-auto"
            th:text="${res.status}"
          >
          </span>
        </div>

        <div
          th:each="rr : ${res.reservationRooms}"
          class="border-t border-[#E8E2DA] pt-4"
        >
          <p class="text-xs text-woodsmoke/80">
            <strong>Habitación:</strong>
            <span th:text="${rr.room.number}"></span> (<span
              th:text="${rr.room.type.name}"
            ></span
            >) ·
            <span th:text="'€' + ${rr.pricePerNight} + '/noche'"></span>
          </p>
          <ul class="mt-2 space-y-1">
            <li
              th:each="as : ${rr.acquiredServices}"
              class="text-[11px] text-woodsmoke/70 flex justify-between max-w-xs"
            >
              <span
                th:text="${as.service.name} + ' × ' + ${as.quantity}"
              ></span>
              <span class="font-semibold" th:text="'€' + ${as.subtotal}"></span>
            </li>
          </ul>
        </div>

        <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-[#E8E2DA]">
          <a
            th:href="@{'/reservations/edit/' + ${res.id}}"
            class="inline-flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white text-[10px] uppercase tracking-[1.5px] font-bold py-2 px-4 rounded-[2px] transition duration-300"
          >
            Editar
          </a>
          <a
            th:href="@{'/reservations/delete/' + ${res.id}}"
            class="inline-flex items-center gap-1 bg-red-600 hover:bg-red-700 text-white text-[10px] uppercase tracking-[1.5px] font-bold py-2 px-4 rounded-[2px] transition duration-300"
            onclick="
              return confirm(
                '¿Estás seguro de que deseas cancelar esta reserva? Esta acción no se puede revertir.',
              );
            "
          >
            Cancelar Reserva
          </a>
        </div>
      </div>
    </main>

    <div th:replace="~{fragmentos :: footer}"></div>
  </body>
</html>
