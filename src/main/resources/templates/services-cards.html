<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios - Montclair Grand Hotel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              twine: {
                DEFAULT: "#BF925A",
                hover: "#73503C",
              },
              mirage: "#141E26",
              pampas: "#F2EEEB",
              woodsmoke: "#111413",
              silver: "#CAC6C6",
            },
            fontFamily: {
              serif: ['"Cinzel"', "serif"],
              sans: ['"Inter"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-pampas text-woodsmoke font-sans antialiased min-h-screen p-6 lg:p-12"
  >
    <div class="max-w-6xl mx-auto">
      <!-- Header / Navigation Bar -->
      <div
        class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-6 mb-8 border-b border-silver/50 gap-4"
      >
        <div>
          <a
            href="/"
            class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline mb-1 inline-block"
            >← Volver al Inicio</a
          >
          <h1 class="font-serif text-3xl text-woodsmoke tracking-[2px]">
            Catálogo de Servicios
          </h1>
          <p class="text-xs text-woodsmoke/70 mt-1">
            Explora nuestras experiencias y comodidades exclusivas
          </p>
        </div>
        <div class="flex items-center gap-3">
          <a
            href="/services"
            class="bg-white border border-silver hover:border-twine text-woodsmoke text-[10px] uppercase tracking-[1.5px] font-bold px-4 py-2.5 rounded-[2px] transition"
          >
            Ver en Tabla
          </a>
          <a
            href="/services/new"
            class="bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[1.5px] font-bold px-5 py-2.5 rounded-[2px] transition shadow-sm"
          >
            + Nuevo Servicio
          </a>
        </div>
      </div>

      <!-- Cards Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <article
          th:each="svc : ${services}"
          class="bg-white border border-silver/80 rounded-[3px] overflow-hidden shadow-sm flex flex-col hover:shadow-md transition"
        >
          <div class="relative h-48 bg-mirage/10 overflow-hidden">
            <img
              th:src="${svc.imageUrl}"
              th:alt="${svc.name}"
              class="w-full h-full object-cover"
            />
            <span
              class="absolute top-3 right-3 bg-mirage/90 text-white font-bold text-xs px-2.5 py-1 rounded-[2px] shadow"
              th:text="${svc.price} + ' €'"
            ></span>
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <div class="flex items-center justify-between gap-2 mb-2">
              <h3
                class="font-serif text-base font-bold text-woodsmoke tracking-[1px] uppercase"
                th:text="${svc.name}"
              >
                Servicio
              </h3>
              <span
                class="font-mono text-[10px] text-twine font-bold"
                th:text="'#' + ${svc.id}"
                >#1</span
              >
            </div>
            <p
              class="text-xs text-woodsmoke/80 leading-relaxed mb-6 flex-grow"
              th:text="${svc.description}"
            >
              Descripción del servicio
            </p>

            <div
              class="pt-4 border-t border-silver/40 flex items-center justify-between gap-2"
            >
              <a
                th:href="@{'/services/' + ${svc.id}}"
                class="text-twine hover:text-twine-hover font-bold text-[10px] uppercase tracking-[1.5px] transition"
                >Detalles →</a
              >
              <div class="flex items-center gap-1.5">
                <a
                  th:href="@{'/services/edit/' + ${svc.id}}"
                  class="text-[9px] uppercase font-bold tracking-[1px] px-2 py-1 bg-pampas hover:bg-twine/20 text-woodsmoke rounded transition"
                  >Editar</a
                >
                <a
                  th:href="@{'/services/delete/' + ${svc.id}}"
                  onclick="
                    return confirm('¿Estás seguro de eliminar este servicio?');
                  "
                  class="text-[9px] uppercase font-bold tracking-[1px] px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded transition"
                  >Eliminar</a
                >
              </div>
            </div>
          </div>
        </article>
      </div>

      <div
        th:if="${#lists.isEmpty(services)}"
        class="bg-white border border-silver/80 rounded-[3px] p-12 text-center shadow-sm mt-4"
      >
        <p class="text-sm text-woodsmoke/60">
          No hay servicios registrados en este momento.
        </p>
        <a
          href="/services/new"
          class="inline-block mt-4 bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[1.5px] font-bold px-6 py-2.5 rounded-[2px] transition"
          >Crear Primer Servicio</a
        >
      </div>
    </div>
  </body>
</html>
