<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Listado de Clientes</h1>
    <a
      th:href="@{/clients/add}"
      class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded mb-4 inline-block"
    >
      Añadir cliente
    </a>
    <table class="min-w-full bg-white border mt-4">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2">Id</th>
          <th class="px-4 py-2">Usuario</th>
          <th class="px-4 py-2">Email</th>
          <th class="px-4 py-2">Nombre</th>
          <th class="px-4 py-2">Apellido</th>
          <th class="px-4 py-2">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${clients}" class="border-t">
          <td class="px-4 py-2" th:text="${c.id}"></td>
          <td class="px-4 py-2" th:text="${c.username}"></td>
          <td class="px-4 py-2" th:text="${c.email}"></td>
          <td class="px-4 py-2" th:text="${c.firstName}"></td>
          <td class="px-4 py-2" th:text="${c.lastName}"></td>
          <td class="px-4 py-2">
            <a
              th:href="@{'/clients/edit/' + ${c.id}}"
              class="text-blue-600 mr-2"
              >Editar</a
            >
            <a
              th:href="@{'/clients/delete/' + ${c.id}}"
              class="text-red-600"
              onclick="return confirm('¿Eliminar?');"
              >Borrar</a
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
