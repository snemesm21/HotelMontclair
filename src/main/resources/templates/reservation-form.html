<!doctype html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Reserva - Montclair Grand Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              twine: {
                DEFAULT: "#C59B63",
                hover: "#A87C49",
                dark: "#73503C",
                light: "#D4B07A",
              },
              mirage: { DEFAULT: "#141E26", dark: "#0F161C", light: "#1C2A35" },
              pampas: "#FAF7F2",
              pampasAlt: "#F0EBE3",
              woodsmoke: "#111413",
              silver: "#CAC6C6",
              ivory: "#FDFBF7",
            },
            fontFamily: {
              serif: ['"Cinzel"', "serif"],
              sans: ['"Inter"', "sans-serif"],
              display: ['"Cormorant Garamond"', "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-pampas text-woodsmoke font-sans antialiased selection:bg-twine selection:text-white min-h-screen flex flex-col justify-between"
  >
    <div th:replace="~{fragmentos :: navbar}"></div>

    <main class="flex-grow max-w-3xl w-full mx-auto p-6 sm:p-8 lg:p-12">
      <div class="text-center mb-10">
        <span
          class="font-sans text-[9px] tracking-[4px] text-twine uppercase font-bold block mb-2"
          >RESERVA TU ESTANCIA</span
        >
        <h1
          class="font-serif text-3xl sm:text-4xl text-woodsmoke tracking-[2px] uppercase"
        >
          Nueva Reserva
        </h1>
        <div class="flex items-center justify-center gap-3 mt-3">
          <div class="h-[1px] w-10 bg-twine/40"></div>
          <div class="w-2 h-2 rotate-45 border border-twine"></div>
          <div class="h-[1px] w-10 bg-twine/40"></div>
        </div>
      </div>

      <div
        class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-lg p-8 sm:p-10 relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 right-0 h-1 bg-twine"></div>

        <form th:action="@{/reservations/new}" method="post" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label
                class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
                >Fecha de Entrada *</label
              >
              <input
                type="date"
                name="checkInDate"
                required
                class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
              />
            </div>
            <div>
              <label
                class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
                >Fecha de Salida *</label
              >
              <input
                type="date"
                name="checkOutDate"
                required
                class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
              />
            </div>
          </div>

          <div>
            <label
              class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
              >Cantidad de Huéspedes *</label
            >
            <input
              type="number"
              name="numberOfPeople"
              min="1"
              value="1"
              required
              class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
            />
          </div>

          <div>
            <label
              class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-2"
              >Habitación Disponible *</label
            >
            <div
              class="space-y-1 max-h-64 overflow-y-auto border border-[#E8E2DA] rounded-[2px] p-3"
            >
              <label
                th:each="room : ${rooms}"
                class="flex items-center gap-3 p-2 rounded-[2px] hover:bg-pampas transition cursor-pointer"
              >
                <input
                  type="radio"
                  name="roomId"
                  th:value="${room.id}"
                  th:checked="${preselectedRoomId != null and preselectedRoomId == room.id}"
                  required
                  class="accent-twine"
                />
                <span
                  class="text-xs text-woodsmoke"
                  th:text="'#' + ${room.number} + ' · ' + ${room.type.name} + ' · €' + ${room.pricePerNight} + '/noche'"
                ></span>
              </label>
              <p
                th:if="${#lists.isEmpty(rooms)}"
                class="text-xs text-woodsmoke/50 italic p-2"
              >
                No hay habitaciones disponibles en este momento.
              </p>
            </div>
          </div>

          <div>
            <label
              class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-2"
              >Servicios Adicionales (opcional)</label
            >
            <div class="space-y-1 border border-[#E8E2DA] rounded-[2px] p-3">
              <label
                th:each="svc : ${services}"
                class="flex items-center gap-3 p-2 rounded-[2px] hover:bg-pampas transition cursor-pointer"
              >
                <input
                  type="checkbox"
                  name="serviceIds"
                  th:value="${svc.id}"
                  class="accent-twine"
                />
                <span
                  class="text-xs text-woodsmoke"
                  th:text="${svc.name} + ' · ' + ${svc.getPriceLabel()}"
                ></span>
              </label>
            </div>
          </div>

          <div class="pt-2 flex justify-end">
            <button
              type="submit"
              class="w-full sm:w-auto bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-8 rounded-[2px] transition duration-300 shadow-sm"
            >
              Confirmar Reserva
            </button>
          </div>
        </form>
      </div>
    </main>

    <div th:replace="~{fragmentos :: footer}"></div>
  </body>
</html>
