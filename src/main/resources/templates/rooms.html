<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Habitaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Listado de Habitaciones</h1>
    <a
      th:href="@{/rooms/add}"
      class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded mb-4 inline-block"
    >
      Añadir habitación
    </a>
    <table class="min-w-full bg-white border">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2">Id</th>
          <th class="px-4 py-2">Número</th>
          <th class="px-4 py-2">Piso</th>
          <th class="px-4 py-2">Tipo (id)</th>
          <th class="px-4 py-2">Estado</th>
          <th class="px-4 py-2">Acciones</th>
        </tr>
      </thead>
      <tbody th:each="room : ${rooms}">
        <tr class="border-t">
          <td class="px-4 py-2" th:text="${room.id}"></td>
          <td class="px-4 py-2" th:text="${room.number}"></td>
          <td class="px-4 py-2" th:text="${room.floor}"></td>
          <td class="px-4 py-2" th:text="${room.typeId}"></td>
          <td class="px-4 py-2" th:text="${room.status}"></td>
          <td class="px-4 py-2">
            <a
              th:href="@{'/rooms/edit/' + ${room.id}}"
              class="text-blue-600 mr-2"
              >Editar</a
            >
            <a
              th:href="@{'/rooms/delete/' + ${room.id}}"
              class="text-red-600"
              onclick="return confirm('¿Eliminar?');"
              >Borrar</a
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
