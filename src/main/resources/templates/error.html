<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error | Montclair Grand Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--pampas);
      }
      .error-header {
        padding: 18px 24px;
        background: var(--mirage);
        border-bottom: 4px solid var(--twine);
        text-align: center;
      }
      .error-brand {
        color: white;
        font-family: var(--font-serif);
        font-size: 20px;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
      .error-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }
      .error-card {
        width: min(100%, 620px);
        padding: 48px 32px;
        background: #fff;
        border: 1px solid #e3ddd4;
        border-top: 5px solid var(--twine);
        box-shadow: 0 18px 40px rgba(20, 30, 38, 0.12);
        text-align: center;
      }
      .error-kicker {
        color: var(--twine);
        font-family: var(--font-sans);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .error-title {
        margin: 14px 0;
        color: var(--mirage);
        font-family: var(--font-serif);
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 400;
        text-transform: uppercase;
      }
      .error-message {
        margin: 0 auto 28px;
        max-width: 480px;
        color: #5f6870;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 300;
        line-height: 1.7;
      }
      .error-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body class="error-page">
    <header class="error-header">
      <img
        src="/Images/Logo_oscuro.png"
        alt="Montclair Grand Hotel"
        style="
          height: 70px;
          width: 200px;
          object-fit: cover;
          margin: 0 auto;
          display: block;
        "
      />
    </header>
    <main class="error-main">
      <section class="error-card">
        <span class="error-kicker">Montclair Grand Hotel</span>
        <h1 class="error-title">Ocurrió un error</h1>
        <p class="error-message" th:text="${mensaje}">
          No fue posible completar la solicitud.
        </p>
        <div class="error-actions">
          <a class="btn btn-primary" href="/">Volver al inicio</a>
          <a class="btn btn-outline" href="javascript:history.back()"
            >Regresar</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
