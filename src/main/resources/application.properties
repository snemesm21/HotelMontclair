
spring.application.name=demo
spring.profiles.default=dev

# ==========================================
# BASE DE DATOS H2
# ==========================================

spring.datasource.url=jdbc:h2:mem:hotelmontclair;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# CONSOLA H2
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVIDOR
# ==========================================

server.port=8080
server.tomcat.threads.max=200

# ==========================================
# POOL DE CONEXIONES
# ==========================================

spring.datasource.hikari.maximum-pool-size=20

# ==========================================
# GOOGLE OAUTH2 AUTHORIZATION CODE + PKCE
# ==========================================

hotelmontclair.google.client-id=${GOOGLE_CLIENT_ID:}
hotelmontclair.google.client-secret=${GOOGLE_CLIENT_SECRET:}
hotelmontclair.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
hotelmontclair.google.token-uri=https://oauth2.googleapis.com/token
hotelmontclair.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
hotelmontclair.google.issuer=https://accounts.google.com
hotelmontclair.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ==========================================
# FRONTEND
# ==========================================

hotelmontclair.frontend-url=http://localhost:4200

# ==========================================
# JWT Y COOKIES
# ==========================================

hotelmontclair.auth.jwt-secret=${APP_AUTH_JWT_SECRET:}
hotelmontclair.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ==========================================
# PERFIL DE PRUEBAS
# ==========================================

#---
spring.config.activate.on-profile=test

server.port=8080

# Base de datos independiente para pruebas
spring.datasource.url=jdbc:h2:mem:hotelmontclair_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 desactivada en pruebas
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Hibernate para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones para pruebas
spring.datasource.hikari.maximum-pool-size=5
