
spring.application.name=demo
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties],optional:classpath:application-secret.properties

# ==========================================
# BASE DE DATOS H2
# ==========================================

spring.datasource.url=jdbc:h2:mem:hotelmontclair;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# CONSOLA H2
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVIDOR
# ==========================================

server.port=8080
server.tomcat.threads.max=200
server.error.include-message=always

# ==========================================
# POOL DE CONEXIONES
# ==========================================

spring.datasource.hikari.maximum-pool-size=20

# ==========================================
# GOOGLE OAUTH2 AUTHORIZATION CODE + PKCE
# ==========================================

hotelmontclair.google.client-id=${GOOGLE_CLIENT_ID:}
hotelmontclair.google.client-secret=${GOOGLE_CLIENT_SECRET:}
hotelmontclair.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
hotelmontclair.google.token-uri=https://oauth2.googleapis.com/token
hotelmontclair.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
hotelmontclair.google.issuer=https://accounts.google.com
hotelmontclair.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# ==========================================
# FRONTEND
# ==========================================

hotelmontclair.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ==========================================
# JWT Y COOKIES
# ==========================================

hotelmontclair.auth.jwt-secret=${APP_AUTH_JWT_SECRET:}
hotelmontclair.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ==========================================
# TURISMO Y OPTIMIZACION DE RECORRIDOS
# ==========================================

hotelmontclair.tourism.hotel.address=${TOURISM_HOTEL_ADDRESS:Hôtel Hermitage Monte-Carlo, Square Beaumarchais, 98000 Monaco}
# Coordenadas exactas de Montclair Grand Hotel (Hôtel Hermitage Monte-Carlo, Square Beaumarchais, Monaco)
hotelmontclair.tourism.hotel.latitude=${HOTEL_TOURISM_LATITUDE:43.7384432}
hotelmontclair.tourism.hotel.longitude=${HOTEL_TOURISM_LONGITUDE:7.4259517}
hotelmontclair.tourism.hotel.maps-url=${TOURISM_HOTEL_MAPS_URL:https://maps.app.goo.gl/hGMqVYHjjAP1ZwFLA}
hotelmontclair.tourism.routing.driving-url=${TOURISM_OSRM_DRIVING_URL:https://router.project-osrm.org}
hotelmontclair.tourism.routing.walking-url=${TOURISM_OSRM_WALKING_URL:https://routing.openstreetmap.de/routed-foot}

# ==========================================
# CORREOS AUTOMATICOS (RESEND)
# ==========================================

hotelmontclair.mail.enabled=${MAIL_ENABLED:true}
hotelmontclair.mail.resend-api-key=${RESEND_API_KEY:}
hotelmontclair.mail.from=${MAIL_FROM:MontClair Grand Hotel <reservas@angaritateamo.com>}
hotelmontclair.mail.reply-to=${MAIL_REPLY_TO:concierge@angaritateamo.com}

# ==========================================
# PASARELA DE PAGOS BOLD
# ==========================================

hotelmontclair.bold.api-key=${BOLD_API_KEY:}
hotelmontclair.bold.secret-key=${BOLD_SECRET_KEY:${BOLD_WEBHOOK_SECRET:}}
hotelmontclair.bold.fixed-amount=${BOLD_FIXED_AMOUNT:1}
hotelmontclair.bold.currency=${BOLD_CURRENCY:USD}

# ==========================================
# AGENTE DE VOZ CONVERSACIONAL (LLAMADAS)
# ==========================================
# Proveedores soportados: TWILIO, VAPI, BLAND, ELEVENLABS, WEBHOOK
hotelmontclair.voice.enabled=${VOICE_ENABLED:true}
hotelmontclair.voice.provider=${VOICE_PROVIDER:TWILIO}
hotelmontclair.voice.default-country-code=${VOICE_DEFAULT_COUNTRY_CODE:+57}
hotelmontclair.voice.fallback-phone=${VOICE_FALLBACK_PHONE:}
hotelmontclair.voice.agent-name=${VOICE_AGENT_NAME:Sof\u00EDa}
hotelmontclair.voice.max-duration-minutes=${VOICE_MAX_DURATION_MINUTES:4}
hotelmontclair.voice.max-calls-per-day=${VOICE_MAX_CALLS_PER_DAY:15}
hotelmontclair.voice.public-base-url=${VOICE_PUBLIC_BASE_URL:}

# Opcion Directa: Twilio Programmable Voice + Speech Recognition (Voz Google Neural2 de alta naturalidad)
hotelmontclair.voice.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
hotelmontclair.voice.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
hotelmontclair.voice.twilio.from-number=${TWILIO_FROM_NUMBER:}
hotelmontclair.voice.twilio.voice=${TWILIO_VOICE:Google.es-US-Neural2-A}

# Opcion 1 (Recomendada): Bland AI (https://app.bland.ai - incluye creditos gratis y no requiere Twilio)
hotelmontclair.voice.bland.api-key=${BLAND_API_KEY:}
hotelmontclair.voice.bland.voice=${BLAND_VOICE:maya}

# Opcion 2: Vapi.ai (https://vapi.ai - incluye $10 USD gratis)
hotelmontclair.voice.vapi.api-key=${VAPI_API_KEY:}
hotelmontclair.voice.vapi.phone-number-id=${VAPI_PHONE_NUMBER_ID:}
hotelmontclair.voice.vapi.assistant-id=${VAPI_ASSISTANT_ID:}

# Opcion 3: ElevenLabs Conversational AI + Twilio
hotelmontclair.voice.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
hotelmontclair.voice.elevenlabs.agent-id=${ELEVENLABS_AGENT_ID:}
hotelmontclair.voice.elevenlabs.phone-number-id=${ELEVENLABS_PHONE_NUMBER_ID:}

# Opcion 4: Webhook externo (ej. n8n)
hotelmontclair.voice.webhook.url=${VOICE_WEBHOOK_URL:}

# ==========================================
# PERFIL DE PRUEBAS
# ==========================================

#---
spring.config.activate.on-profile=test

server.port=8080
hotelmontclair.mail.enabled=false
hotelmontclair.voice.enabled=false

# Base de datos independiente para pruebas
spring.datasource.url=jdbc:h2:mem:hotelmontclair_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 desactivada en pruebas
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Hibernate para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones para pruebas
spring.datasource.hikari.maximum-pool-size=5